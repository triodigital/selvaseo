<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070"/>
      <stop offset="50%" stop-color="#C99700"/>
      <stop offset="100%" stop-color="#996F00"/>
    </linearGradient>
    <linearGradient id="blueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A47"/>
      <stop offset="100%" stop-color="#071829"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="58" fill="url(#goldRim)"/>
  <circle cx="60" cy="60" r="54" fill="url(#blueRing)"/>
  <circle cx="60" cy="60" r="41" fill="url(#goldRim)"/>
  <circle cx="60" cy="60" r="39" fill="#FFFFFF"/>

  <!-- University Name in Ring -->
  <path id="textArcTop" d="M 18,60 A 42,42 0 1,1 102,60" fill="none"/>
  <text font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="7.2" font-weight="bold" fill="#F7D070" letter-spacing="1.2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">UNIVERSITY OF MADRAS</textPath>
  </text>
  <path id="textArcBottom" d="M 102,60 A 42,42 0 0,1 18,60" fill="none"/>
  <text font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="7" font-weight="bold" fill="#F7D070" letter-spacing="2">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">★ ESTD 1857 ★</textPath>
  </text>

  <!-- Inner Coat of Arms Shield -->
  <!-- Shield Shape -->
  <path d="M42 35 H78 V60 C78 72 60 79 60 79 C60 79 42 72 42 60 Z" fill="#F9FAFB" stroke="#0E2A47" stroke-width="1.8"/>

  <!-- Chief (Upper part of shield) -->
  <path d="M42 35 H78 V48 H42 Z" fill="#0E2A47"/>

  <!-- Golden Pale in Chief -->
  <rect x="54" y="35" width="12" height="13" fill="#D4AF37"/>

  <!-- Lotus Flower in center pale -->
  <path d="M60 38 C58 41 57 44 60 46 C63 44 62 41 60 38 Z" fill="#FFFFFF"/>
  <path d="M57 41 C55 43 56 46 59 46 Z" fill="#FCE4EC"/>
  <path d="M63 41 C65 43 64 46 61 46 Z" fill="#FCE4EC"/>

  <!-- Left Elephant Head -->
  <path d="M48 38 C46 38 44 40 45 42 C45 44 47 45 48 45 C49 43 49 41 48 38 Z" fill="#FFFFFF"/>
  <path d="M44 42 C43 44 43 46 44 47" stroke="#FFFFFF" stroke-width="1" fill="none"/>

  <!-- Right Elephant Head -->
  <path d="M72 38 C74 38 76 40 75 42 C75 44 73 45 72 45 C71 43 71 41 72 38 Z" fill="#FFFFFF"/>
  <path d="M76 42 C77 44 77 46 76 47" stroke="#FFFFFF" stroke-width="1" fill="none"/>

  <!-- Green Mount at bottom of shield -->
  <path d="M42 60 C50 56 70 56 78 60 C78 72 60 79 60 79 C60 79 42 72 42 60 Z" fill="#2E7D32"/>

  <!-- Bengal Tiger Passant -->
  <path d="M48 56 C50 53 54 53 57 54 C60 52 66 52 70 54 C72 55 72 57 70 57 C67 56 64 56 62 57 C60 58 57 58 55 57 C53 58 50 58 48 56 Z" fill="#E65100"/>
  <!-- Tiger Stripes & Details -->
  <circle cx="49" cy="54" r="1.5" fill="#E65100"/>
  <path d="M53 53 L54 56 M58 53 L58 56 M63 53 L63 56" stroke="#000000" stroke-width="0.8"/>
  <path d="M69 54 C71 52 73 52 74 53" stroke="#E65100" stroke-width="1" fill="none"/>

  <!-- Motto Ribbon Below Shield -->
  <path d="M30 82 Q60 88 90 82 L88 88 Q60 94 32 88 Z" fill="#D4AF37" stroke="#996F00" stroke-width="0.8"/>
  <path id="mottoArc" d="M 32,86 Q 60,92 88,86" fill="none"/>
  <text font-family="'Times New Roman', serif" font-size="3.4" font-weight="bold" fill="#071829" letter-spacing="0.4">
    <textPath href="#mottoArc" startOffset="50%" text-anchor="middle">DOCTRINA VIM PROMOVET INSITAM</textPath>
  </text>
</svg>
