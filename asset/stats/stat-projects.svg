<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="projFolder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="projTab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="projCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="projGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <circle cx="32" cy="32" r="22" fill="#DBEAFE" opacity="0.6"/>

  <!-- Back Folder Tab -->
  <path d="M12 18 C12 15.8 13.8 14 16 14 H26 L30 18 H48 C50.2 18 52 19.8 52 22 V27 H12 Z" fill="url(#projTab)"/>

  <!-- Inside Document Paper -->
  <rect x="16" y="20" width="32" height="20" rx="3" fill="#FFFFFF" opacity="0.95"/>
  <line x1="20" y1="26" x2="36" y2="26" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="31" x2="30" y2="31" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round"/>

  <!-- Front Folder Body -->
  <g filter="url(#projGlow)">
    <path d="M10 26 H54 C55.5 26 56.5 27.5 56 29 L51.5 49 C51 51 49.2 52.5 47 52.5 H13 C10.8 52.5 9 51 8.5 49 L4 29 C3.5 27.5 4.5 26 6 26 Z" fill="url(#projFolder)"/>
  </g>

  <!-- Verified Project Badge Seal -->
  <circle cx="43" cy="41" r="11" fill="url(#projCheck)" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M38 41 L41.5 44.5 L48 37" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
