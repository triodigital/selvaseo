<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="growthArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#97A87A"/>
      <stop offset="100%" stop-color="#708253"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DB9558"/>
      <stop offset="100%" stop-color="#B87333"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="growthGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <circle cx="32" cy="32" r="22" fill="#D1FAE5" opacity="0.6"/>

  <!-- Analytics Chart Bars -->
  <rect x="12" y="38" width="6" height="16" rx="3" fill="#A7F3D0"/>
  <rect x="22" y="30" width="6" height="24" rx="3" fill="url(#barGrad1)"/>
  <rect x="32" y="24" width="6" height="30" rx="3" fill="url(#barGrad2)"/>
  <rect x="42" y="16" width="6" height="38" rx="3" fill="url(#growthGrad)"/>

  <!-- Upward Area Fill -->
  <path d="M12 40 L22 32 L32 26 L45 15 L45 54 L12 54 Z" fill="url(#growthArea)"/>

  <!-- Soaring Growth Arrow Curve -->
  <path d="M10 44 Q 24 38, 30 28 T 48 12" stroke="url(#growthGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#growthGlow)"/>

  <!-- Arrowhead Badge -->
  <path d="M41 12 H49 V20" stroke="#059669" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Star Sparkle at Peak -->
  <path d="M52 10 L53.5 13 L56.5 13 L54 15 L55 18 L52 16 L49 18 L50 15 L47.5 13 L50.5 13 Z" fill="#F59E0B"/>
</svg>
