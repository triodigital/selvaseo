<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="kwKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="kwTarget" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <filter id="kwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#EA580C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <circle cx="32" cy="32" r="22" fill="#FFEDD5" opacity="0.6"/>

  <!-- Target Rings -->
  <circle cx="28" cy="28" r="20" stroke="url(#kwTarget)" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="28" cy="28" r="14" stroke="#FDBA74" stroke-width="2.5"/>

  <!-- Master Key -->
  <g filter="url(#kwGlow)">
    <!-- Key Bow / Handle (Magnifying rim) -->
    <circle cx="24" cy="24" r="12" stroke="url(#kwKey)" stroke-width="4.5" fill="none"/>
    <circle cx="24" cy="24" r="4.5" fill="#FED7AA"/>

    <!-- Key Shaft -->
    <path d="M33 33 L52 52" stroke="url(#kwKey)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Key Bits / Teeth -->
    <path d="M43 43 L48 38" stroke="url(#kwKey)" stroke-width="4" stroke-linecap="round"/>
    <path d="M48 48 L53 43" stroke="url(#kwKey)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- SERP #1 Star Badge -->
  <circle cx="48" cy="18" r="8" fill="#DB9558"/>
  <path d="M48 13 L49.3 16.2 L52.5 16.5 L50 18.7 L50.8 22 L48 20.2 L45.2 22 L46 18.7 L43.5 16.5 L46.7 16.2 Z" fill="#FFFFFF"/>
</svg>
