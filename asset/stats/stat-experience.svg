<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="expCupInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="expBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F2A24"/>
      <stop offset="50%" stop-color="#35483D"/>
      <stop offset="100%" stop-color="#1F2A24"/>
    </linearGradient>
    <filter id="expGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Backlight -->
  <circle cx="32" cy="30" r="22" fill="#FEF3C7" opacity="0.6"/>

  <!-- Left Ribbon Wing -->
  <path d="M18 18 L10 18 Q8 25 12 32 Q16 38 20 40 L21 34 Q16 32 14 26 L18 26 Z" fill="url(#expGrad)" opacity="0.9"/>
  <!-- Right Ribbon Wing -->
  <path d="M46 18 L54 18 Q56 25 52 32 Q48 38 44 40 L43 34 Q48 32 50 26 L46 26 Z" fill="url(#expGrad)" opacity="0.9"/>

  <!-- Main Trophy Cup -->
  <g filter="url(#expGlow)">
    <path d="M19 14 H45 V26 C45 34.5 39 41 32 41 C25 41 19 34.5 19 26 Z" fill="url(#expGrad)"/>
    <ellipse cx="32" cy="14" rx="13" ry="3.5" fill="#FEF08A"/>
    <!-- Trophy Lip Shadow -->
    <ellipse cx="32" cy="15" rx="11" ry="2" fill="url(#expCupInner)" opacity="0.4"/>
  </g>

  <!-- Star Embellishment -->
  <path d="M32 21 L33.8 25.2 L38.2 25.6 L34.9 28.5 L35.9 33 L32 30.6 L28.1 33 L29.1 28.5 L25.8 25.6 L30.2 25.2 Z" fill="#FFFFFF"/>

  <!-- Stem -->
  <rect x="29" y="41" width="6" height="8" rx="1.5" fill="url(#expGrad)"/>
  <path d="M26 49 H38 L41 55 H23 Z" fill="url(#expBase)"/>
  <rect x="22" y="55" width="20" height="3" rx="1.5" fill="#DB9558"/>

  <!-- Shimmer Highlights -->
  <circle cx="23" cy="20" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="41" cy="22" r="1.2" fill="#FFFFFF" opacity="0.8"/>
</svg>
